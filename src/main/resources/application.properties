# Escucha en todas las interfaces para que el celular/tablet en tu misma red Wi-Fi pueda conectarse
server.address=0.0.0.0
server.port=8081

# Clave secreta: cualquier dispositivo debe enviarla para dar órdenes. ¡CÁMBIALA!
jarvis.token=cambia-esta-clave

# Nombre con el que te llama JARVIS
# (la eñe se escribe \u00f1 porque Spring lee este archivo como ISO-8859-1)
jarvis.owner=se\u00f1or

# Datos del negocio que salen en el comprobante de venta (escriba la ñ como \u00f1, la í como \u00ed, etc.)
jarvis.negocio.nombre=Ferreter\u00eda Mi Negocio
jarvis.negocio.ruc=
jarvis.negocio.direccion=

# Navegador para la ventana de escritorio: chrome | edge
jarvis.browser=chrome

# (Opcional) Cerebro con IA: pon tu clave de la API de Claude en la variable de entorno ANTHROPIC_API_KEY.
# Si no hay clave, JARVIS solo usa sus comandos integrados.
jarvis.ai.api-key=${ANTHROPIC_API_KEY:}
jarvis.ai.model=claude-sonnet-5-5

# Modo escritorio: icono junto al reloj + ventana propia al arrancar (false = solo servidor)
jarvis.desktop.enabled=true

# Como programa de escritorio no hay consola: los mensajes se guardan aqui
logging.file.name=${user.home}/jarvis.log

# ===== Agente autónomo (modo JARVIS que hace tareas solo) =====
# Necesita ANTHROPIC_API_KEY. El agente piensa y usa herramientas por su cuenta.
jarvis.agent.model=claude-sonnet-5-5

# auto-approve=false  -> antes de EJECUTAR COMANDOS o ESCRIBIR archivos, JARVIS te pide
#                        permiso en pantalla (AUTORIZAR / RECHAZAR). Es lo recomendado.
# auto-approve=true   -> hace todo solo, sin preguntar. Más cómodo, pero dale esto solo
#                        cuando ya confíes en él.
jarvis.agent.auto-approve=false

# allow-dangerous=true quita el freno a comandos que BORRAN o dañan datos (del, rm, format…).
# Mantenlo SIEMPRE en false salvo que sepas exactamente lo que haces.
jarvis.agent.allow-dangerous=false

# Carpeta donde trabaja el agente (crea y guarda archivos). Vacío = tu carpeta de usuario.
jarvis.agent.workdir=${user.home}\\JARVIS

# Cuánto texto de salida puede leer de un comando o archivo
jarvis.agent.max-output=6000

# ===== Reconocimiento de intenciones local y offline (DJL + ONNX Runtime) =====
# Carpeta con model.onnx y tokenizer.json de un modelo de embeddings multilingüe, p. ej.
# https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
#   (onnx/model.onnx y tokenizer.json). Si no existen, JARVIS usa solo sus reglas clásicas.
jarvis.intent.enabled=true
jarvis.intent.model-dir=${user.home}/jarvis-models/intent
# Frases de ejemplo por intención (en src/main/resources). Añade las de tu negocio.
jarvis.intent.examples=intents-es.json
# Similitud mínima (0..1) para aceptar la intención; por debajo se usan las reglas clásicas.
jarvis.intent.threshold=0.62
# Ventaja mínima sobre la segunda intención para no considerarla ambigua.
jarvis.intent.margin=0.04
# true si el ONNX pide token_type_ids (modelos tipo BERT). Si falla, se prueba lo contrario solo.
jarvis.intent.include-token-types=true
