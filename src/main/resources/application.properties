# Escucha en todas las interfaces para que el celular/tablet en tu misma red Wi-Fi pueda conectarse
server.address=0.0.0.0
server.port=8081

# Clave secreta: cualquier dispositivo debe enviarla para dar órdenes. ¡CÁMBIALA!
jarvis.token=RACS

# Intentos con clave incorrecta permitidos por IP y por minuto; al pasarlos, esa IP recibe 429 un minuto.
jarvis.security.max-failures-per-minute=10

# Nombre con el que te llama JARVIS
# (la eñe se escribe \u00f1 porque Spring lee este archivo como ISO-8859-1)
jarvis.owner=se\u00f1or

# Nombre de su negocio (tienda de ropa, bodega, ferretería...). Sale en el saludo, en el título de la
# pantalla y en el comprobante de venta. Vacío = no se muestra.
# Escriba la ñ como ñ, la í como í, etc. Ej.: jarvis.negocio=Zapatería Mi Paso
jarvis.negocio=

# Otros datos que salen en el comprobante de venta (opcionales)
jarvis.negocio.ruc=
jarvis.negocio.direccion=
jarvis.negocio.telefono=
jarvis.negocio.email=

# Comprobante que se emite si no se pide otro: boleta (B001) o nota de venta (NV01).
# Por voz: "vendi 2 poleras con nota de venta", "con boleta para el DNI 12345678".
jarvis.comprobante.tipo=boleta
# IGV (18%): incluido = los precios ya lo incluyen (el total no cambia; el comprobante separa base e IGV),
# agregado = se suma al precio, exonerado = sin IGV (inafecto o exonerado).
jarvis.igv=incluido

# Diccionario de palabras propias del negocio ("chompa = polera"). Se crea solo la primera vez;
# edítelo con el Bloc de notas o enséñele por voz: "aprende que chompa significa polera".
jarvis.diccionario.file=${user.home}/jarvis-diccionario.txt

# Navegador para la ventana de escritorio: chrome | edge
jarvis.browser=chrome

# Modo escritorio: icono junto al reloj + ventana propia al arrancar (false = solo servidor)
jarvis.desktop.enabled=true

# Como programa de escritorio no hay consola: los mensajes se guardan aqui
logging.file.name=${user.home}/jarvis.log

# ===== Asistente con IA (Claude): entiende frases libres y las ejecuta =====
# Modo mixto: con clave e internet, JARVIS entiende lo que le diga con sus palabras ("vamos a hacer un
# inventario nuevo", "sube 10% el precio del calzado"). Sin clave o sin internet, usa sus reglas de siempre.
# La clave (de console.anthropic.com) va en este archivo, en la primera línea. No la ponga aquí ni la comparta.
jarvis.ia.enabled=true
jarvis.ia.clave-archivo=${user.home}/jarvis-ia-clave.txt
jarvis.ia.modelo=claude-opus-5-5
# Si el modelo declina una petición por sus filtros de seguridad, la API la reintenta con otro modelo.
jarvis.ia.fallback-servidor=true

# ===== Reconocimiento de intenciones local y offline (DJL + ONNX Runtime) =====
# Carpeta con model.onnx y tokenizer.json de un modelo de embeddings multilingüe, p. ej.
# https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
#   (onnx/model.onnx y tokenizer.json). Si no existen, JARVIS usa solo sus reglas clásicas.
jarvis.intent.enabled=true
jarvis.intent.model-dir=${user.home}/jarvis-models/intent
# Frases de ejemplo por intención (en src/main/resources). Añade las de tu negocio.
jarvis.intent.examples=intents-es.json
# Similitud mínima (0..1) para aceptar la intención; por debajo se usan las reglas clásicas.
jarvis.intent.threshold=0.62
# Ventaja mínima sobre la segunda intención para no considerarla ambigua.
jarvis.intent.margin=0.04
# true si el ONNX pide token_type_ids (modelos tipo BERT). Si falla, se prueba lo contrario solo.
jarvis.intent.include-token-types=true
