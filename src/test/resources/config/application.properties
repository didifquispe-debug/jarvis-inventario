# Solo para las pruebas: Spring carga este archivo ENCIMA de src/main/resources/application.properties.
# Así ninguna prueba toca el inventario, la clave ni la ventana reales del usuario.
jarvis.inventory.file=${java.io.tmpdir}/jarvis-test-${random.uuid}.json
jarvis.token-file=${java.io.tmpdir}/jarvis-test-clave-${random.uuid}
jarvis.desktop.enabled=false
jarvis.diccionario.file=${java.io.tmpdir}/jarvis-test-diccionario-${random.uuid}.txt
# Las pruebas nunca llaman a la IA real (costaría dinero y fallaría sin internet)
jarvis.ia.enabled=false
# La voz sin Internet no se carga en cada prueba (pesa ~100 MB); VozSinInternetTest la prueba aparte
jarvis.voz.local.enabled=false
